services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    environment:
      MONGO_URI: mongodb://host.docker.internal:27017/medi-connect

    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000

    ports:
      - "5173:5173"

    depends_on:
      - backend