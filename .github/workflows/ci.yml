name: MediConnect CI/CD

on:
  push:
    branches:
      - main
      - appointment

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: annuanand/medi-connect-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://13.60.44.112:5000
          tags: annuanand/medi-connect-frontend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull annuanand/medi-connect-backend:latest
            docker pull annuanand/medi-connect-frontend:latest

            docker stop medi-connect-backend || true
            docker rm medi-connect-backend || true

            docker stop medi-connect-frontend || true
            docker rm medi-connect-frontend || true

            docker run -d \
              --name medi-connect-backend \
              --network medi-connect-network \
              --restart unless-stopped \
              --env-file ~/medi-connect-backend.env \
              -p 5000:5000 \
              annuanand/medi-connect-backend:latest

            docker run -d \
              --name medi-connect-frontend \
              --network medi-connect-network \
              --restart unless-stopped \
              -p 5173:5173 \
              annuanand/medi-connect-frontend:latest

            docker image prune -f